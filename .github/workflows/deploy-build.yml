name: Deploy Build Branch

on:
  push:
    branches:
      - Build
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run check

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Public smoke proof
        env:
          GOLDRUSH_PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run proof:public -- --url "$GOLDRUSH_PUBLIC_URL"
